<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <section class="card">

            <p class="etiqueta">Countdown Timer</p>

            <h1>Cuenta regresiva al evento</h1>

            <p class="descripcion">
                Selecciona una fecha y hora para iniciar la cuenta regresiva.
            </p>

            <div class="formulario">
                <input type="datetime-local" id="fechaEvento">

                <button id="botonIniciar">
                    Iniciar cuenta regresiva
                </button>
            </div>

            <div id="resultado" class="contador">
                Selecciona una fecha para comenzar.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
